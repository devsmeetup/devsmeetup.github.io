  date: '2026-09-30'
  local_time: '20:00'
  description: |
    Zu dem DevsMeetup Freiburg 2026-09 darf jeder sein eigenes Thema rund um Softwareentwicklung mitbringen. Wir finden uns dann zu Gruppen zusammen, diskutieren die Themen und erzählen nachher den anderen, was wir zusammen getragen haben. 
    Natürlich stehen wir auch einfach noch bei einem Getränk zusammen.
